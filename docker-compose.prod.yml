x-partizan-service: &partizan-service
  image: partizan-bot:prod
  build:
    context: .
  env_file:
    - ${PARTIZAN_ENV_FILE:-.env.prod}
  environment: &partizan-environment
    APP_ENV: production
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    DATABASE_URL: ${CONTAINER_DATABASE_URL:?Set CONTAINER_DATABASE_URL in .env.prod}
    RUNTIME_STORAGE: database
    PARTIZAN_RELEASE_SHA: ${PARTIZAN_RELEASE_SHA:-unknown}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partizan
      POSTGRES_USER: partizan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partizan -d partizan"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - partizan_postgres:/var/lib/postgresql/data

  migrate:
    <<: *partizan-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *partizan-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    ports:
      - "127.0.0.1:${PARTIZAN_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  paid-control-worker:
    <<: *partizan-service
    command:
      [
        "sh",
        "-c",
        "partizan-paid-control --interval-seconds $${PAID_CONTROL_INTERVAL_SECONDS:-60}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

  autonomous-growth-worker:
    <<: *partizan-service
    command:
      [
        "sh",
        "-c",
        "partizan-autonomous-growth --interval-seconds $${AUTONOMOUS_GROWTH_INTERVAL_SECONDS:-300}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  partizan_postgres:
