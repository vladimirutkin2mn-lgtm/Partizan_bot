name: One-shot v10 cheeky Telegram review (no publish)

on:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: telegram-saved-prompt-v10-review-pr545
  cancel-in-progress: false

jobs:
  review:
    # Manual-only after the bounded research. Never incur costs on PR pushes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check production research-only connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing research connection ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Verify pinned production host key
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Generate one v10 draft per eligible SAVED latest post
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          # Pass audited candidate prompt and precheck source to the deployed
          # container via base64 arguments; do not install/deploy PR code.
          PROMPT_B64=$(base64 -w0 app/community_message_prompt.py)
          PRECHECK_B64=$(base64 -w0 app/telegram_message_precheck.py)
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python - '${PROMPT_B64}' '${PRECHECK_B64}'" \
            < tools/review_saved_telegram_prompt_v10.py > telegram-v10-private-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("telegram-v10-private-review.json").read_text())
          assert report["telegram_api_calls"] == 0
          assert report["publication_actions"] == 0
          assert report["max_llm_calls"] == 1
          assert report["selected_cases"] == 1
          assert report["status"] in {
              "REVIEW_ONLY", "NO_ELIGIBLE_SAVED_POSTS",
              "OPENAI_API_NOT_CONFIGURED", "INCOMPLETE_MODEL_ERROR",
              "FROZEN_CASES_MISMATCH", "FULL_SNAPSHOT_NOT_AVAILABLE",
          }
          print(json.dumps({
              k: report.get(k) for k in (
                  "status", "selected_cases", "calls", "skipped_before_model",
                  "input_tokens", "output_tokens",
                  "telegram_api_calls", "publication_actions",
              )
          }, sort_keys=True))
          if report["status"] == "REVIEW_ONLY":
              assert report["calls"] == 1, "Exactly one pinned full post should be drafted"
              assert any(row.get("comment") for row in report["results"])
              assert all(row.get("comment") for row in report["results"]
                         if row.get("input_tokens", 0) > 0)
          if report["status"] != "REVIEW_ONLY":
              print("::warning::Real saved-post benchmark incomplete; inspect artifact")
          PY
      - name: Save private v10 draft for human quality grading
        uses: actions/upload-artifact@v4
        with:
          name: telegram-v10-saved-post-review-PR545
          path: telegram-v10-private-review.json
          retention-days: 3
          if-no-files-found: error
