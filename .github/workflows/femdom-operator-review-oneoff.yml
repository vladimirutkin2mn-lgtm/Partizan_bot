# Re-run only when the corresponding production build is deployed; failures log structured stderr.
name: One-off reviewed FemDom Telegram surface and audience reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/femdom-operator-review-oneoff.yml

concurrency:
  group: one-time-femdom-user-observed-surface-reconciliation-20261025
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require production read access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing production access: ${name}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin production host
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Wait until matching production release is deployed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_RELEASE: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -c \"import os,sys; sys.exit(0 if os.environ.get('PARTIZAN_RELEASE_SHA') == '${EXPECTED_RELEASE}' else 2)\"" \
              >/dev/null 2>&1; then
              echo "Matching release ready"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Matching production release not ready; no recovery attempted"
          exit 1
      - name: Preview manually reviewed audiences without writes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python -m app.femdom_operator_telegram_review --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272" \
            > operator-preview.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('operator-preview.json').read_text())
          assert r['status']=='OPERATOR_FEEDBACK_RECONCILIATION_COMPLETE'
          assert r['mode']=='PREVIEW_ONLY'
          assert r['reviewed']==8
          assert r['telegram_search_calls']==r['telegram_join_calls']==r['telegram_send_calls']==0
          assert r['publisher_permission_granted'] is False
          print(json.dumps({
              'registry_before':r['registry_before'],
              'confirmed_before':r['confirmed_before'],
              'reviewed':r['reviewed']
          },sort_keys=True))
          PY
      - name: Apply user-verified audience classification only, not permissions
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python -m app.femdom_operator_telegram_review --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 --commit" \
            > operator-applied.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('operator-applied.json').read_text())
          assert r['status']=='OPERATOR_FEEDBACK_RECONCILIATION_COMPLETE'
          assert r['mode']=='COMMIT'
          assert r['reviewed']==8
          assert r['registry_before']==r['registry_after']
          assert r['confirmed_after']>=r['confirmed_before']
          assert r['telegram_search_calls']==r['telegram_join_calls']==r['telegram_send_calls']==0
          assert r['publisher_permission_granted'] is False
          print(json.dumps({
              'registry_after':r['registry_after'],
              'confirmed_after':r['confirmed_after'],
              'added_confirmations':r['added_confirmations'],
              'reviewed':r['reviewed']
          },sort_keys=True))
          PY
      - name: Archive operator review trace
        uses: actions/upload-artifact@v4
        with:
          name: femdom-operator-review-surface-and-fit-20261025
          path: |
            operator-preview.json
            operator-applied.json
          retention-days: 5
          if-no-files-found: error
