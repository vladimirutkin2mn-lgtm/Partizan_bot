name: One-off authorized BizarreClub linked discussion join

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/femdom-bizarreclub-authorized-join-once.yml

permissions:
  contents: read

concurrency:
  group: femdom-bizarreclub-linked-join-owner-approved-once-20261025
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check production access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production access requirement: ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin known host
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify matching production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -c \"import os,sys; sys.exit(0 if os.environ.get('PARTIZAN_RELEASE_SHA') == '${EXPECTED_SHA}' else 2)\"" \
              >/dev/null 2>&1; then
              echo "Matching production release ready"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production release not ready: skipping Telegram"
          exit 1
      - name: Join exactly one verified linked Telegram group (authorized by owner)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set +e
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -m app.femdom_bizarreclub_authorized_join_once \
              --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 \
              --project-id 124cdd70-49b0-48b3-aee0-a037dda4bcd0 \
              --expected-linked-chat-id 1506400194" \
              > bizarreclub-authorized-join-result.json
          code=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("bizarreclub-authorized-join-result.json")
          assert path.exists(), "No join result received"
          row = json.loads(path.read_text())
          assert row["channel_handle"] == "bizarreclubmsk"
          assert row["linked_chat_id"] == 1506400194
          assert row["messages_sent"] == 0
          assert row["profile_changes"] == 0
          assert row["publisher_approval_granted"] is False
          print(json.dumps({
              "status": row["status"], "joined": row["joined"],
              "channel_handle": row["channel_handle"],
              "linked_chat_id": row["linked_chat_id"],
              "write_access": row.get("write_access"),
              "reason": row.get("reason"),
              "messages_sent": 0, "profile_changes": 0,
          }, ensure_ascii=False))
          PY
          exit "$code"
      - name: Save safe authorized join result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizarreclub-authorized-join-result
          path: bizarreclub-authorized-join-result.json
          retention-days: 3
          if-no-files-found: warn
