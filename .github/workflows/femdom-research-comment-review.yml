name: Prepare FemDom research-only comment previews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/femdom-research-comment-review.yml

permissions:
  contents: read

concurrency:
  group: femdom-research-comment-review-oneoff
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require production connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required connection: ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin production host
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Require matching production SHA before preparing a draft
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -c \"import os,sys; sys.exit(0 if os.environ.get('PARTIZAN_RELEASE_SHA') == '${EXPECTED_SHA}' else 2)\"" \
              >/dev/null 2>&1; then
              echo "Matching deployed release confirmed"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deployed release did not match, no draft attempted"
          exit 1
      - name: Draft latest two saved posts strictly for human research review
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for peer in a_sfera play_hard_community; do
            ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
                python -m app.femdom_research_comment_preview \
                --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 \
                --project-id 124cdd70-49b0-48b3-aee0-a037dda4bcd0 \
                --handle ${peer}" > "femdom-${peer}-research-only-drafts.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for peer in ("a_sfera", "play_hard_community"):
              result = json.loads(
                  Path(f"femdom-{peer}-research-only-drafts.json").read_text()
              )
              assert result["status"] in (
                  "AWAITING_HUMAN_CONTEXT_AND_POLICY_REVIEW",
                  "RESEARCH_PREVIEW_BLOCKED",
                  "API_NOT_CONFIGURED",
              )
              assert result.get("published", False) is False
              if result["status"] != "API_NOT_CONFIGURED":
                  assert result["action_sendable"] is False
                  assert result["publisher_permission_verified"] is False
                  assert result["community_commercial_rules_verified"] is False
              if result["status"] == "AWAITING_HUMAN_CONTEXT_AND_POLICY_REVIEW":
                  assert result["target_url"].startswith(f"https://t.me/{peer}/")
                  assert "variants" not in result
                  assert result["prompt_version"] == (
                      "community_message_v6_write_once"
                  )
              print(json.dumps({
                  "status": result["status"],
                  "handle": peer,
                  "target_url": result.get("target_url"),
                  "comment_generated": bool(result.get("comment")),
                  "comment_language": result.get("comment_language"),
                  "prompt_version": result.get("prompt_version"),
                  "topicality": result.get("topicality"),
                  "published": result.get("published", False),
                  "input_tokens": result.get("input_tokens", 0),
                  "output_tokens": result.get("output_tokens", 0),
              }, ensure_ascii=False))
          PY
      - name: Store private unapproved drafts for operator review
        uses: actions/upload-artifact@v4
        with:
          name: femdom-two-peer-research-drafts-unapproved
          path: femdom-*-research-only-drafts.json
          retention-days: 7
          if-no-files-found: error
