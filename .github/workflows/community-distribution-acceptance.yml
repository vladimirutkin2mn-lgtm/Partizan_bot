name: Community distribution acceptance

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Optional customer project UUID to scope the evidence report"
        required: false
        type: string
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]

jobs:
  report:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Resolve acceptance release
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Refuse stale acceptance release
        id: freshness
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve current main HEAD; refusing production evidence collection"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${current_main_sha}" ]]; then
            echo "acceptance_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale acceptance report: release ${RELEASE_SHA} is not current main ${current_main_sha}"
            exit 0
          fi
          echo "acceptance_allowed=true" >> "$GITHUB_OUTPUT"

      - name: Require production verification configuration
        if: ${{ steps.freshness.outputs.acceptance_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production verification configuration: ${missing[*]}"
            exit 1
          fi

      - name: Validate optional project scope
        if: ${{ steps.freshness.outputs.acceptance_allowed == 'true' }}
        id: scope
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        shell: bash
        run: |
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "project_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          canonical="$(python -c 'import sys, uuid; print(uuid.UUID(sys.argv[1]))' "${PROJECT_ID}")"
          echo "project_id=${canonical}" >> "$GITHUB_OUTPUT"

      - name: Start SSH agent
        if: ${{ steps.freshness.outputs.acceptance_allowed == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        if: ${{ steps.freshness.outputs.acceptance_allowed == 'true' }}
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect read-only production acceptance evidence
        if: ${{ steps.freshness.outputs.acceptance_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROJECT_ID: ${{ steps.scope.outputs.project_id }}
        shell: bash
        run: |
          remote_args="--pretty"
          if [[ -n "${PROJECT_ID}" ]]; then
            remote_args="--project-id ${PROJECT_ID} --pretty"
          fi
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python - ${remote_args}" \
            < tools/report_community_distribution_acceptance.py
