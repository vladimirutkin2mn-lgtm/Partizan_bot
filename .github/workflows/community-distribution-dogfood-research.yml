name: Community distribution dogfood research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Community distribution acceptance"]
    types: [completed]

jobs:
  research:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Resolve research release
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Refuse stale or unmarked automatic research
        id: gate
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve current main HEAD; refusing production research"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${current_main_sha}" ]]; then
            echo "research_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale dogfood research release"
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            if ! git log -1 --format=%B "${RELEASE_SHA}" | grep -Fq '[community-dogfood-research]'; then
              echo "research_allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Automatic dogfood research marker is absent; skipping"
              exit 0
            fi
          fi
          echo "research_allowed=true" >> "$GITHUB_OUTPUT"

      - name: Require production verification configuration
        if: ${{ steps.gate.outputs.research_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production research configuration: ${missing[*]}"
            exit 1
          fi

      - name: Start SSH agent
        if: ${{ steps.gate.outputs.research_allowed == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        if: ${{ steps.gate.outputs.research_allowed == 'true' }}
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run bounded first-party community research
        id: dogfood
        if: ${{ steps.gate.outputs.research_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python - --max-reddit 5" \
            < tools/run_community_distribution_dogfood_research.py

      - name: Report production acceptance after research
        if: ${{ always() && steps.gate.outputs.research_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python - --pretty" \
            < tools/report_community_distribution_acceptance.py
