name: Growth Balance production readiness

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: growth-balance-production-readiness
  cancel-in-progress: false

jobs:
  readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Resolve production release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            release_sha="${DEPLOYED_SHA}"
          else
            release_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | awk 'NR == 1 {print $1}')"
          fi
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve production release"
            exit 1
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Refuse stale production release
        id: freshness
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve current main HEAD"
            exit 1
          fi
          if [[ "${RELEASE_SHA}" != "${current_main_sha}" ]]; then
            echo "readiness_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale production readiness release"
            exit 0
          fi
          echo "readiness_allowed=true" >> "$GITHUB_OUTPUT"

      - name: Require production readiness configuration
        if: ${{ steps.freshness.outputs.readiness_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production readiness configuration: ${missing[*]}"
            exit 1
          fi

      - name: Start SSH agent
        if: ${{ steps.freshness.outputs.readiness_allowed == 'true' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        if: ${{ steps.freshness.outputs.readiness_allowed == 'true' }}
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Report non-sensitive Growth Balance readiness
        if: ${{ steps.freshness.outputs.readiness_allowed == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python -m app.growth_balance_readiness --pretty"
