name: Meta OAuth pending-state probe

on:
  pull_request:
    paths:
      - .github/workflows/meta-oauth-pending-probe.yml

concurrency:
  group: partizan-production
  cancel-in-progress: false

jobs:
  probe-meta-oauth-pending:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Refuse stale main
        env:
          EXPECTED_MAIN_SHA: 306eb8473e344fb6abe38377fa151f610dd27b23
        shell: bash
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ "${current_main_sha}" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "::error::main moved from ${EXPECTED_MAIN_SHA} to ${current_main_sha}; refusing production probe"
            exit 1
          fi

      - name: Require deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read Meta OAuth pending state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PROJECT_ID: 700bbc15-02c4-4238-9aa5-e6caaff49b18
        shell: bash
        run: |
          set -euo pipefail
          printf -v deploy_path_q '%q' "${DEPLOY_PATH}"
          printf -v project_id_q '%q' "${PROJECT_ID}"
          ssh -o BatchMode=yes "${DEPLOY_HOST}" "bash -s -- ${deploy_path_q} ${project_id_q}" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          PROJECT_ID="$2"
          cd "${DEPLOY_PATH}"
          test -f .env.prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T -e PROJECT_ID="${PROJECT_ID}" api python - <<'PY'
          import os
          from uuid import UUID
          from app.customer_meta_oauth import CUSTOMER_META_PENDING_NAMESPACE
          from app.runtime_store import get_runtime_store

          project_id = str(UUID(os.environ['PROJECT_ID']))
          pending = get_runtime_store().get(CUSTOMER_META_PENDING_NAMESPACE, project_id)
          print(f'pending_exists={pending is not None}')
          if pending is None:
              raise SystemExit(0)
          accounts = pending.get('ad_accounts', []) if isinstance(pending, dict) else []
          pages = pending.get('pages_by_ad_account', {}) if isinstance(pending, dict) else {}
          print(f'ad_account_count={len(accounts)}')
          print(f'page_account_count={len(pages)}')
          for idx, account in enumerate(accounts[:10], start=1):
              account_id = str(account.get('account_id') or '')
              name = str(account.get('name') or '')
              page_count = len(pages.get(account_id, [])) if isinstance(pages, dict) else 0
              print(f'account_{idx}_id={account_id}')
              print(f'account_{idx}_name={name}')
              print(f'account_{idx}_page_count={page_count}')
          print(f'secret_reference_present={bool(pending.get("secret_reference"))}')
          PY
          REMOTE
