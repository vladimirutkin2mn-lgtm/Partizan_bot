name: Production edge watchdog

# The deploy pipeline only proves the site is reachable at the end of a deploy. Anything
# that touches the host afterwards — another workflow, an operator over ssh, the shared
# proxy's own redeploy — can detach the API from the proxy network, and the API stays
# healthy while the public hostname serves 502. This watchdog is the only check that runs
# when nobody is deploying, so a recurrence is repaired or reported in minutes instead of
# being noticed by a colleague.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: partizan-production
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Probe public edge
        id: probe
        env:
          PARTIZAN_PUBLIC_URL: ${{ secrets.PARTIZAN_PUBLIC_URL }}
          PARTIZAN_PUBLIC_EDGE_ATTEMPTS: "3"
        shell: bash
        run: |
          if [[ -z "${PARTIZAN_PUBLIC_URL}" ]]; then
            echo "::error::Edge watchdog is not configured: PARTIZAN_PUBLIC_URL is missing"
            exit 1
          fi

          if bash tools/verify_public_edge.sh; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start SSH agent
        if: ${{ steps.probe.outputs.healthy == 'false' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        if: ${{ steps.probe.outputs.healthy == 'false' }}
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Repair shared-host edge attachment
        id: repair
        if: ${{ steps.probe.outputs.healthy == 'false' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PARTIZAN_PUBLIC_URL: ${{ secrets.PARTIZAN_PUBLIC_URL }}
          PARTIZAN_MANAGED_EDGE: ${{ vars.PARTIZAN_MANAGED_EDGE || 'true' }}
        shell: bash
        run: |
          if [[ "${PARTIZAN_MANAGED_EDGE}" != "false" ]]; then
            echo "::notice::Managed edge deployment: no shared-proxy repair to attempt"
            exit 0
          fi

          # The repair validates the proxy config, rolls back anything it changed and
          # refuses to touch the neighbouring product's routes.
          bash tools/ensure_shared_host_caddy_route.sh || true

      - name: Re-probe public edge after repair
        id: recheck
        if: ${{ steps.probe.outputs.healthy == 'false' }}
        env:
          PARTIZAN_PUBLIC_URL: ${{ secrets.PARTIZAN_PUBLIC_URL }}
          PARTIZAN_PUBLIC_EDGE_ATTEMPTS: "3"
        shell: bash
        run: |
          if bash tools/verify_public_edge.sh; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update production edge incident
        if: ${{ steps.probe.outputs.healthy == 'false' && steps.recheck.outputs.healthy != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='🚨 Production edge unreachable'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/partizan-edge-incident.md"
          cat > "${body_file}" <<EOF
          The public production hostname is not serving \`/health/live\` and \`/health/ready\`, and the automatic shared-proxy repair did not restore it.

          - Last watchdog run: ${run_url}
          - Detected at: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Start with \`tools/diagnose_shared_host_tls.sh\`. The API container can be healthy while the public hostname is down: that is an edge attachment or proxy route failure, not an application failure.

          This issue is maintained automatically by the edge watchdog. It closes on the first run that finds the edge healthy again.
          EOF

          issue_number="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "🚨 Production edge unreachable") | .number' \
            | head -n 1)"

          if [[ -n "${issue_number}" ]]; then
            gh issue edit "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}"
          fi

      - name: Close recovered production edge incident
        if: ${{ steps.probe.outputs.healthy == 'true' || steps.recheck.outputs.healthy == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIRED: ${{ steps.recheck.outputs.healthy == 'true' }}
        shell: bash
        run: |
          issue_number="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "🚨 Production edge unreachable") | .number' \
            | head -n 1)"
          if [[ -z "${issue_number}" ]]; then
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${REPAIRED}" == "true" ]]; then
            comment="Public edge restored by the automatic shared-proxy repair: ${run_url}"
          else
            comment="Public edge is healthy again: ${run_url}"
          fi

          gh issue close "${issue_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --reason completed \
            --comment "${comment}"
