name: FemDom first live publish safety preflight (no send)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/femdom-first-live-publish-preflight.yml

permissions:
  contents: read

concurrency:
  group: femdom-first-publish-preflight-readonly-20261025
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check production access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production access requirement: ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin known host
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify matching production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -c \"import os,sys; sys.exit(0 if os.environ.get('PARTIZAN_RELEASE_SHA') == '${EXPECTED_SHA}' else 2)\"" \
              >/dev/null 2>&1; then
              echo "Matching production release ready"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production release not ready: skipping Telegram"
          exit 1
      - name: Preflight verified drafts and publisher session without sending
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for peer in a_sfera play_hard_community bizarreclubmsk findom_gospoja0 poiskrabovirabin; do
            ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
                python -m app.femdom_first_publish_preflight \
                --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 \
                --project-id 124cdd70-49b0-48b3-aee0-a037dda4bcd0 \
                --handle ${peer}" > "first-publish-${peer}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          peers = (
              "a_sfera", "play_hard_community", "bizarreclubmsk",
              "findom_gospoja0", "poiskrabovirabin",
          )
          for handle in peers:
              row = json.loads(Path(f"first-publish-{handle}.json").read_text())
              assert row["handle"] == handle
              for key in (
                  "published", "joined", "profile_mutated",
                  "distribution_action_created", "customer_approval_recorded",
                  "send_allowed",
              ):
                  assert row[key] is False, (handle, key)
              assert row["llm_calls"] == 0
              assert row["paid_search_calls"] == 0
              print(json.dumps({
                  "handle": handle,
                  "status": row["status"],
                  "reason": row.get("reason"),
                  "target_url": row.get("target_url"),
                  "account_status": row.get("account_preflight", {}).get("status"),
                  "discussion_status": row.get("discussion_preflight", {}).get("status"),
                  "profile_status": row.get("profile_preflight", {}).get("status"),
                  "draft_existing": bool(row.get("draft_sha256")),
                  "published": False,
              }, ensure_ascii=False))
          PY
      - name: Save private read-only first-publish readiness
        uses: actions/upload-artifact@v4
        with:
          name: femdom-first-publish-readonly-preflight
          path: first-publish-*.json
          retention-days: 3
          if-no-files-found: error
