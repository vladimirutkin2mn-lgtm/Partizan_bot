name: One-off FemDom latest-target and draft-only review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/femdom-telegram-preview.yml

permissions:
  contents: read

concurrency:
  group: femdom-latest-target-drafts-oneoff-20261025
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check production access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing production access requirement: ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin known host
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Verify matching production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -c \"import os,sys; sys.exit(0 if os.environ.get('PARTIZAN_RELEASE_SHA') == '${EXPECTED_SHA}' else 2)\"" \
              >/dev/null 2>&1; then
              echo "Matching production release ready"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Production release not ready: skipping Telegram"
          exit 1
      - name: Inspect one newest post per reviewed peer and reconcile research evidence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
              python -m app.femdom_latest_target_reconcile \
              --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 \
              --project-id 124cdd70-49b0-48b3-aee0-a037dda4bcd0" \
              > femdom-latest-target-research.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("femdom-latest-target-research.json").read_text())
          assert report["status"] in (
              "FEMDOM_LATEST_ONLY_RECONCILIATION_COMPLETE",
              "DEFERRED_FLOOD_WAIT",
          )
          for key in (
              "new_global_search_calls", "llm_new_calls", "telegram_messages_sent",
              "publisher_approvals", "profile_changes", "channel_toggle_changes",
          ):
              if key in report:
                  assert report[key] == 0
          for row in report.get("communities", []):
              assert row.get("post_read_count", 0) <= 1
              assert row["publisher_permission_verified"] is False
          print(json.dumps({
              "status": report["status"],
              "communities": [
                  {
                      "handle": item.get("handle"), "status": item.get("status"),
                      "audience": item.get("audience"),
                      "research_latest_post_url": item.get("research_latest_post_url"),
                      "action_target_url": item.get("action_target_url"),
                  } for item in report.get("communities", [])
              ],
          }, ensure_ascii=False))
          PY
      - name: Prepare at most one unsendable draft for each verified reviewed peer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for peer in a_sfera play_hard_community bizarreclubmsk findom_gospoja0 poiskrabovirabin fem_tut moscowellebdsm1 bizarre_afisha; do
            ssh -o BatchMode=yes "${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api \
                python -m app.femdom_research_comment_preview \
                --product-id 52d7e59e-5ac5-4363-b829-c93e33e48272 \
                --project-id 124cdd70-49b0-48b3-aee0-a037dda4bcd0 \
                --handle ${peer}" > "femdom-${peer}-research-draft.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for peer in ('a_sfera', 'play_hard_community', 'bizarreclubmsk',
                       'findom_gospoja0', 'poiskrabovirabin', 'fem_tut',
                       'moscowellebdsm1', 'bizarre_afisha'):
              row = json.loads(Path(f'femdom-{peer}-research-draft.json').read_text())
              assert row['status'] in (
                  'AWAITING_HUMAN_CONTEXT_AND_POLICY_REVIEW',
                  'RESEARCH_PREVIEW_BLOCKED', 'API_NOT_CONFIGURED',
              )
              assert row.get('published', False) is False
              assert row.get('action_sendable', False) is False
              assert row.get('publisher_permission_verified', False) is False
              assert row.get('community_commercial_rules_verified', False) is False
              print(json.dumps({
                  'handle': peer, 'status': row['status'],
                  'target_url': row.get('target_url'),
                  'reason_if_blocked': row.get('reason'),
                  'draft_generated': bool(row.get('comment')),
                  'surface': row.get('surface'),
                  'published': False,
              }, ensure_ascii=False))
          PY

      - name: Save private research-only reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: femdom-latest-target-and-drafts-evidence
          path: |
            femdom-latest-target-research.json
            femdom-*-research-draft.json
          retention-days: 7
          if-no-files-found: error
