name: Inspect FemDom opportunities once

on:
  push:
    branches:
      - ops/run-femdom-refresh-2026-10-09

concurrency:
  group: femdom-opportunity-inspect-now
  cancel-in-progress: false

jobs:
  inspect-opportunities:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Require production connection configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production inspection configuration: ${missing[*]}"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read current FemDom opportunity portfolio
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python -" <<'PY'
          import json
          from collections import Counter
          from uuid import UUID

          from app.customer_live_opportunities import (
              CUSTOMER_LIVE_OPPORTUNITY_NAMESPACE,
              customer_live_opportunity_service,
          )
          from app.runtime_store import get_runtime_store

          project_id = UUID("124cdd70-49b0-48b3-aee0-a037dda4bcd0")
          store = get_runtime_store()
          raw_by_id = {
              str(row.get("opportunity_id")): row
              for row in store.list_namespace(CUSTOMER_LIVE_OPPORTUNITY_NAMESPACE)
              if str(row.get("project_id") or "") == str(project_id)
          }
          views = customer_live_opportunity_service.list_for_project(project_id)
          active = [
              item for item in views
              if item.status == "ACTIVE" and item.platform == "TELEGRAM"
          ]
          payload = []
          for item in active:
              raw = raw_by_id.get(item.opportunity_id, {})
              metadata = raw.get("metadata") if isinstance(raw.get("metadata"), dict) else {}
              payload.append({
                  "opportunity_id": item.opportunity_id,
                  "title": item.title,
                  "url": str(item.url),
                  "kind": item.kind,
                  "publishability": item.publishability,
                  "freshness": item.freshness,
                  "relevance_score": item.relevance_score,
                  "source_published_at": metadata.get("source_published_at"),
                  "expires_at": item.expires_at.isoformat() if item.expires_at else None,
                  "publishability_detail": item.publishability_detail,
              })
          print(json.dumps({
              "active_telegram_count": len(active),
              "publishability_counts": dict(Counter(item.publishability for item in active)),
              "opportunities": payload,
          }, ensure_ascii=False))
          PY
