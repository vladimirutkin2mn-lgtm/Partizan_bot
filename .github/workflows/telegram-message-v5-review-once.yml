name: One-shot saved Telegram v5 quality review (no publish)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/telegram-message-v5-review-once.yml


permissions:
  contents: read

concurrency:
  group: telegram-saved-prompt-v5-review-pr545
  cancel-in-progress: false

jobs:
  review:
    # One controlled PR research run, then remove the pull_request trigger.
    if: github.event.pull_request.number == 545
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check production research-only connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          for key in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing research connection ${key}"
              exit 1
            fi
          done
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Verify pinned production host key
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HOST_KEYS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Generate one v5 draft per eligible SAVED latest post
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          # Pass audited candidate prompt and precheck source to the deployed
          # container via base64 arguments; do not install/deploy PR code.
          PROMPT_B64=$(base64 -w0 app/community_message_prompt.py)
          PRECHECK_B64=$(base64 -w0 app/telegram_message_precheck.py)
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && bash tools/compose_shared_host.sh exec -T api python - '${PROMPT_B64}' '${PRECHECK_B64}'" \
            < tools/review_saved_telegram_prompts_v5.py > telegram-v5-private-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("telegram-v5-private-review.json").read_text())
          assert report["telegram_api_calls"] == 0
          assert report["publication_actions"] == 0
          assert report["max_llm_calls"] == 6
          assert report["selected_cases"] <= 6
          assert report["status"] in {
              "REVIEW_ONLY", "NO_ELIGIBLE_SAVED_POSTS",
              "OPENAI_API_NOT_CONFIGURED", "INCOMPLETE_MODEL_ERROR",
          }
          print(json.dumps({
              k: report.get(k) for k in (
                  "status", "selected_cases", "calls", "skipped_before_model",
                  "input_tokens", "output_tokens",
                  "telegram_api_calls", "publication_actions",
              )
          }, sort_keys=True))
          if report["status"] != "REVIEW_ONLY":
              print("::warning::Real saved-post benchmark incomplete; inspect artifact")
          PY
      - name: Save private v5 draft for human quality grading
        uses: actions/upload-artifact@v4
        with:
          name: telegram-v5-saved-post-review-PR545
          path: telegram-v5-private-review.json
          retention-days: 3
          if-no-files-found: error
