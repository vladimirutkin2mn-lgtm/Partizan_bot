name: Patch inline recommended move CTA

on:
  push:
    branches:
      - fix/inline-recommended-move-cta

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inline-recommended-move-cta
      - name: Apply inline CTA patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js_path = Path('app/web/workspace.v1.js')
          js = js_path.read_text()

          old = """    const button = $('activation-primary');
    button.disabled = false;
"""
          new = """    const button = $('activation-primary');
    const activationActionPanel = document.querySelector('.activation-action-primary');
    const activationActionHome = activationActionPanel.querySelector('div');
    activationActionHome.append(button);
    activationActionPanel.classList.remove('hidden');
    button.disabled = false;
"""
          if old not in js:
              if new not in js:
                  raise SystemExit('renderActivation button anchor not found')
          else:
              js = js.replace(old, new, 1)

          old = """      $('activation-channel-title').textContent = 'Do this now';
      $('activation-channel-copy').textContent = signalToWatch
        ? `${recommendedMove} Watch: ${signalToWatch}`
        : recommendedMove;
      setActivationStep('activation-channel', false, true, 'Do now');
"""
          new = """      $('activation-channel-title').textContent = 'Do this now';
      $('activation-channel-copy').textContent = signalToWatch
        ? `${recommendedMove} Watch: ${signalToWatch}`
        : recommendedMove;
      $('activation-channel').querySelector('div').append(button);
      activationActionPanel.classList.add('hidden');
      setActivationStep('activation-channel', false, true, 'Do now');
"""
          if old not in js:
              if new not in js:
                  raise SystemExit('preview opportunity anchor not found')
          else:
              js = js.replace(old, new, 1)

          js_path.write_text(js)

          test_path = Path('tests/test_customer_workspace_project_ui.py')
          tests = test_path.read_text()
          anchor = """    assert \"button.textContent = 'Open where to do this →';\" in js
    assert 'button.textContent = `Set up this ${money(maxCost)} test →`;' in js
"""
          replacement = """    assert \"button.textContent = 'Open where to do this →';\" in js
    assert 'button.textContent = `Set up this ${money(maxCost)} test →`;' in js
    assert \"document.querySelector('.activation-action-primary')\" in js
    assert \"activationActionHome.append(button);\" in js
    assert \"$('activation-channel').querySelector('div').append(button);\" in js
    assert \"activationActionPanel.classList.add('hidden');\" in js
"""
          if anchor not in tests:
              if replacement not in tests:
                  raise SystemExit('workspace CTA test anchor not found')
          else:
              tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests)
          PY

          node --check app/web/workspace.v1.js
          python -m pip install -q -e '.[dev]'
          pytest -q tests/test_customer_workspace_project_ui.py

          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/web/workspace.v1.js tests/test_customer_workspace_project_ui.py
          git commit -m 'Put the recommended move CTA inside the current step'
          git push origin HEAD:fix/inline-recommended-move-cta
