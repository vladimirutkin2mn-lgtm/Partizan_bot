name: Apply actionable recommended move UX

on:
  push:
    branches:
      - fix/recommended-move-next-action

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recommended-move-next-action
          fetch-depth: 0
      - name: Make recommended move actionable
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Validate targeted tests and JavaScript
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_customer_workspace_project_ui.py tests/test_web_workspace.py
          node --check app/web/workspace.v1.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make recommended move show the concrete next action'
          git push origin HEAD:fix/recommended-move-next-action
