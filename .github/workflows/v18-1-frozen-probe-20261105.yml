name: One-time v18.1 review on ten frozen Telegram situations
on:
  push:
    branches: [research/v18-1-frozen-review-20261105]
    paths: [.github/workflows/v18-1-frozen-probe-20261105.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-v18-1-frozen-research-20261105
  cancel-in-progress: false
jobs:
  replay:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install writer on research runner
        run: python -m pip install --quiet -e .
      - name: Retrieve frozen public inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41840368919 -n telethon-five-peers-two-latest-read-only-20261104 -D /tmp/v18-main
          gh run download 41840675392 -n telethon-five-peers-two-latest-read-only-20261104 -D /tmp/v18-albums
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin the existing research connection
        env:
          HOST_KEYS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: One isolated real provider call per target, stop on first error
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TELEGRAM_WRITER_V18_ENABLED: 'true'
          RUNTIME_STORAGE: memory
        run: python tools/v18_frozen_replay.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v18-1-ten-drafts-review
          path: v18-review.json
          retention-days: 2
          if-no-files-found: ignore
