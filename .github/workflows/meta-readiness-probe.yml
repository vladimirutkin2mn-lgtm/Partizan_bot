name: Meta production readiness probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/meta-readiness-probe.yml'

jobs:
  meta-production-readiness:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Refuse stale-main probe
        shell: bash
        env:
          EXPECTED_MAIN_SHA: d4cdd3402f0d00a7136811f8c949f8d0db87dc7e
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ "${current_main_sha}" != "${EXPECTED_MAIN_SHA}" ]]; then
            echo "::error::main moved from ${EXPECTED_MAIN_SHA} to ${current_main_sha}; refusing production probe"
            exit 1
          fi

      - name: Require production connection
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_PATH; do
            [[ -n "${!name:-}" ]] || { echo "::error::missing ${name}"; exit 1; }
          done

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        shell: bash
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read only Meta readiness and validate app credentials
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          path = Path('.env.prod')
          if not path.is_file():
              raise SystemExit('production .env.prod is missing')

          values = {}
          for raw in path.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key.strip()] = value.strip().strip('"').strip("'")

          def configured(name: str) -> bool:
              return bool(values.get(name, '').strip())

          ready = values.get('META_OAUTH_PUBLIC_READY', 'false').strip().lower() == 'true'
          public_base = values.get('PARTIZAN_PUBLIC_BASE_URL', '').rstrip('/')
          version = values.get('META_OAUTH_API_VERSION', '').strip()
          app_id = values.get('META_OAUTH_APP_ID', '').strip()
          app_secret = values.get('META_OAUTH_APP_SECRET', '').strip()

          print(f"meta_app_id_configured={configured('META_OAUTH_APP_ID')}")
          print(f"meta_app_secret_configured={configured('META_OAUTH_APP_SECRET')}")
          print(f"meta_api_version_configured={configured('META_OAUTH_API_VERSION')}")
          print(f"provider_secret_encryption_configured={configured('PROVIDER_SECRET_ENCRYPTION_KEY')}")
          print(f"meta_oauth_public_ready={ready}")
          print(f"production_origin_matches={public_base == 'https://partizanlabs.com'}")
          print("oauth_redirect_uri=https://partizanlabs.com/v1/customer-meta/oauth/callback")
          print(f"meta_api_version={version or '-'}")
          print(f"api_version_shape_ok={version.startswith('v') and version[1:].replace('.', '').isdigit() and version.count('.') == 1}")

          required = all([
              app_id,
              app_secret,
              version,
              configured('PROVIDER_SECRET_ENCRYPTION_KEY'),
              public_base == 'https://partizanlabs.com',
          ])
          print(f"owner_oauth_config_ready={required and ready}")

          token_ok = False
          identity_ok = False
          token_http_status = None
          identity_http_status = None

          if app_id and app_secret and version:
              token_endpoint = f"https://graph.facebook.com/{version}/oauth/access_token"
              token_body = urllib.parse.urlencode({
                  'client_id': app_id,
                  'client_secret': app_secret,
                  'grant_type': 'client_credentials',
              }).encode('utf-8')
              token_request = urllib.request.Request(
                  token_endpoint,
                  data=token_body,
                  headers={'Content-Type': 'application/x-www-form-urlencoded'},
                  method='POST',
              )
              app_token = None
              try:
                  with urllib.request.urlopen(token_request, timeout=15) as response:
                      token_http_status = response.status
                      payload = json.loads(response.read().decode('utf-8'))
                      app_token = payload.get('access_token') if isinstance(payload, dict) else None
                      token_ok = bool(app_token)
              except urllib.error.HTTPError as exc:
                  token_http_status = exc.code
              except (urllib.error.URLError, TimeoutError, ValueError):
                  token_http_status = 0

              if app_token:
                  identity_endpoint = (
                      f"https://graph.facebook.com/{version}/{urllib.parse.quote(app_id, safe='')}"
                      '?fields=id,name'
                  )
                  identity_request = urllib.request.Request(
                      identity_endpoint,
                      headers={'Authorization': f'Bearer {app_token}'},
                      method='GET',
                  )
                  try:
                      with urllib.request.urlopen(identity_request, timeout=15) as response:
                          identity_http_status = response.status
                          payload = json.loads(response.read().decode('utf-8'))
                          identity_ok = (
                              isinstance(payload, dict)
                              and str(payload.get('id') or '') == app_id
                          )
                  except urllib.error.HTTPError as exc:
                      identity_http_status = exc.code
                  except (urllib.error.URLError, TimeoutError, ValueError):
                      identity_http_status = 0

          print(f"meta_app_token_exchange_ok={token_ok}")
          print(f"meta_app_token_http_status={token_http_status if token_http_status is not None else '-'}")
          print(f"meta_app_identity_ok={identity_ok}")
          print(f"meta_app_identity_http_status={identity_http_status if identity_http_status is not None else '-'}")
          PY
          REMOTE
