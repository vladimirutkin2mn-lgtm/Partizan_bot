name: Bootstrap self-dogfood Product

on:
  workflow_dispatch:

concurrency:
  group: self-dogfood-production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Refuse stale main checkout
        id: freshness
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve current main HEAD"
            exit 1
          fi
          if [[ "${GITHUB_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Refusing bootstrap from stale release ${GITHUB_SHA}; current main is ${current_main_sha}"
            exit 1
          fi

      - name: Require production bootstrap configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production bootstrap configuration: ${missing[*]}"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Bootstrap internal Partizan Product only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python -m app.self_dogfood_bootstrap"

      - name: Report self-dogfood readiness after bootstrap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python -m app.self_dogfood"
