name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partizan
          POSTGRES_PASSWORD: partizan
          POSTGRES_DB: partizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partizan -d partizan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://partizan:partizan@localhost:5432/partizan

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check browser JavaScript
        run: |
          node --check app/web/partizan.v1.js
          node --check app/web/execution.v1.js
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Validate compose runtime
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build production image
        run: docker build --tag partizan-bot:ci .
