name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: partizan
          POSTGRES_PASSWORD: partizan
          POSTGRES_DB: partizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partizan -d partizan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://partizan:partizan@localhost:5432/partizan

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check browser JavaScript
        run: |
          for javascript in app/web/*.js; do
            node --check "${javascript}"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check customer design interactions
        run: |
          npm ci --ignore-scripts
          npm run test:design
      - name: Check production shell scripts
        run: |
          bash -n tools/deploy_prod_remote.sh
          bash -n tools/smoke_prod_remote.sh
          bash -n tools/check_prod_config.sh
          bash -n tools/preflight_prod_host.sh
          bash -n tools/bootstrap_prod_host.sh
          bash -n tools/compose_shared_host.sh
          bash -n tools/diagnose_shared_host_tls.sh
          bash -n tools/ensure_shared_host_caddy_route.sh
          bash -n tools/verify_public_edge.sh
          bash -n tools/check_prod_mutation_contract.sh
      - name: Check production mutation contract
        run: bash tools/check_prod_mutation_contract.sh
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Validate development compose runtime
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate production compose runtime
        run: bash tools/check_prod_config.sh .env.example
      - name: Validate production HTTPS edge
        run: |
          PARTIZAN_ENV_FILE=.env.example \
          PARTIZAN_PUBLIC_HOST=partizan.example.com \
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.edge.yml \
              --env-file .env.example \
              config --quiet

          CADDY_VERSION="2.11.7"
          CADDY_ARCHIVE="/tmp/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          CADDY_SHA256="727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b"
          curl --fail --silent --show-error --location \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "${CADDY_ARCHIVE}"
          echo "${CADDY_SHA256}  ${CADDY_ARCHIVE}" | sha256sum --check -
          mkdir -p /tmp/caddy-bin
          tar -xzf "${CADDY_ARCHIVE}" -C /tmp/caddy-bin caddy
          chmod +x /tmp/caddy-bin/caddy
          PARTIZAN_PUBLIC_HOST=partizan.example.com \
            /tmp/caddy-bin/caddy validate --config "$PWD/Caddyfile.prod"
      - name: Validate shared-host runtime
        run: |
          PARTIZAN_ENV_FILE=.env.example \
          PARTIZAN_EDGE_NETWORK=example_proxy_network \
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.shared-host.yml \
              --env-file .env.example \
              config --quiet
          if PARTIZAN_ENV_FILE=.env.example \
               docker compose \
                 -f docker-compose.prod.yml \
                 -f docker-compose.shared-host.yml \
                 --env-file .env.example \
                 config --quiet 2>/dev/null; then
            echo "shared-host overlay accepted a missing PARTIZAN_EDGE_NETWORK" >&2
            exit 1
          fi
      - name: Build production image
        run: docker build --tag partizan-bot:ci .
