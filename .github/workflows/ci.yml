name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partizan
          POSTGRES_PASSWORD: partizan
          POSTGRES_DB: partizan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partizan -d partizan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://partizan:partizan@localhost:5432/partizan

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check browser JavaScript
        run: |
          for javascript in app/web/*.js; do
            node --check "${javascript}"
          done
      - name: Check production shell scripts
        run: |
          bash -n tools/deploy_prod_remote.sh
          bash -n tools/smoke_prod_remote.sh
          bash -n tools/check_prod_config.sh
          bash -n tools/preflight_prod_host.sh
          bash -n tools/bootstrap_prod_host.sh
          bash -n tools/compose_shared_host.sh
          bash -n tools/diagnose_shared_host_tls.sh
      - name: Migrate database
        run: alembic upgrade head
      - name: Test
        run: pytest
      - name: Validate development compose runtime
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate production compose runtime
        run: bash tools/check_prod_config.sh .env.example
      - name: Validate production HTTPS edge
        run: |
          PARTIZAN_ENV_FILE=.env.example \
          PARTIZAN_PUBLIC_HOST=partizan.example.com \
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.edge.yml \
              --env-file .env.example \
              config --quiet
          docker run --rm \
            -e PARTIZAN_PUBLIC_HOST=partizan.example.com \
            -v "$PWD/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate shared-host runtime
        run: |
          PARTIZAN_ENV_FILE=.env.example \
          PARTIZAN_EDGE_NETWORK=example_proxy_network \
            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.shared-host.yml \
              --env-file .env.example \
              config --quiet
          if PARTIZAN_ENV_FILE=.env.example \
               docker compose \
                 -f docker-compose.prod.yml \
                 -f docker-compose.shared-host.yml \
                 --env-file .env.example \
                 config --quiet 2>/dev/null; then
            echo "shared-host overlay accepted a missing PARTIZAN_EDGE_NETWORK" >&2
            exit 1
          fi
      - name: Build production image
        run: docker build --tag partizan-bot:ci .

  self-dogfood-bounded-production:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'ops/run-self-dogfood-bounded-20260916'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Refuse stale main target
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          if [[ "${current_main_sha}" != "966cc738e3d5e93be225e0240e6b557ebcf238f1" ]]; then
            echo "::error::Refusing self-dogfood dry cycle because main moved to ${current_main_sha}"
            exit 1
          fi
      - name: Require production operation configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=(DEPLOY_HOST)
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=(DEPLOY_SSH_KEY)
          [[ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]] && missing+=(DEPLOY_SSH_KNOWN_HOSTS)
          [[ -z "${DEPLOY_PATH}" ]] && missing+=(DEPLOY_PATH)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing production operation configuration: ${missing[*]}"
            exit 1
          fi
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Pin production host key
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run bounded Partizan-on-Partizan dry cycle
        id: dry_cycle
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set +e
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api partizan-growth-run --product-id eb8f160f-1b85-5f1b-a4f0-18038f63ac34 --destination-url https://partizanlabs.com/start --enrich-count 8 --top-icp-count 1 --json" \
            > self-dogfood-raw.log 2>&1
          status=$?
          set -e
          sed -E \
            -e 's/((PARTIZAN_OPERATOR_KEY|X-Partizan-Operator-Key|Authorization)[=: ]+)[^[:space:]]+/\1[REDACTED]/Ig' \
            -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' \
            self-dogfood-raw.log > self-dogfood-diagnostic.log
          rm -f self-dogfood-raw.log
          printf '\nexit_code=%s\n' "${status}" >> self-dogfood-diagnostic.log
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          cat self-dogfood-diagnostic.log
      - name: Report self-dogfood readiness after dry cycle
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          ssh -o BatchMode=yes "${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python -m app.self_dogfood" \
            > self-dogfood-readiness.log 2>&1
          cat self-dogfood-readiness.log
      - name: Upload sanitized self-dogfood diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-dogfood-bounded-diagnostic
          path: |
            self-dogfood-diagnostic.log
            self-dogfood-readiness.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve dry-cycle failure
        if: always() && steps.dry_cycle.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Bounded self-dogfood dry cycle failed; sanitized diagnostic artifact uploaded"
          exit 1
