x-partizan-service: &partizan-service
  image: partizan-bot:local
  build:
    context: .
  env_file:
    - .env
  environment: &partizan-environment
    APP_ENV: ${APP_ENV:-production}
    APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+asyncpg://partizan:partizan@postgres:5432/partizan}
    RUNTIME_STORAGE: database

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partizan
      POSTGRES_USER: partizan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partizan}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partizan -d partizan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - partizan_postgres:/var/lib/postgresql/data

  migrate:
    <<: *partizan-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *partizan-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "${PARTIZAN_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  paid-control-worker:
    <<: *partizan-service
    command:
      [
        "sh",
        "-c",
        "partizan-paid-control --interval-seconds $${PAID_CONTROL_INTERVAL_SECONDS:-60}",
      ]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  partizan_postgres:
