services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: partizan
      POSTGRES_USER: partizan
      POSTGRES_PASSWORD: partizan
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partizan -d partizan"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - partizan_postgres:/var/lib/postgresql/data

volumes:
  partizan_postgres:
