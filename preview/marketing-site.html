<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Partizan marketing preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#080a0d;color:#f4f6f8;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}.loading{display:flex;align-items:center;gap:10px;color:#9aa3ad;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#c8ff4d;box-shadow:0 0 24px rgba(200,255,77,.45);animation:p 1s ease-in-out infinite alternate}@keyframes p{to{opacity:.35;transform:scale(.72)}}
  </style>
</head>
<body>
  <div class="loading"><span class="dot"></span><span>Loading Partizan preview…</span></div>
  <script>
    (() => {
      const root = 'https://raw.githack.com/vladimirutkin2mn-lgtm/Partizan_bot/preview/marketing-site-v1/';
      const base = root + 'app/web/';
      const onboarding = root + 'preview/onboarding.html';

      const bootLanding = () => {
        const budget = document.getElementById('budget-range');
        const budgetValue = document.getElementById('budget-value');
        const channelCount = document.getElementById('channel-count');
        const experimentCount = document.getElementById('experiment-count');
        const customerCount = document.getElementById('customer-count');
        const formatMoney = (value) => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(value);
        const updatePlanner = () => {
          if (!budget) return;
          const value = Number(budget.value), min = Number(budget.min), max = Number(budget.max);
          budget.style.setProperty('--range-pct', `${((value-min)/(max-min))*100}%`);
          if (budgetValue) budgetValue.textContent = formatMoney(value);
          if (channelCount) channelCount.textContent = String(Math.max(2,Math.min(7,Math.round(2+value/900))));
          if (experimentCount) experimentCount.textContent = String(Math.max(3,Math.min(15,Math.round(3+value/270))));
          if (customerCount) customerCount.textContent = `~${Math.max(8,Math.round(value/24))}`;
        };
        budget?.addEventListener('input', updatePlanner); updatePlanner();
        document.querySelectorAll('a[data-preview-start], a.button-primary').forEach((link) => {
          if (!link.href.includes('onboarding.html')) return;
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const value = budget ? Number(budget.value) : 1000;
            window.location.assign(`${onboarding}?budget=${encodeURIComponent(value)}`);
          });
        });
        const revealNodes = [...document.querySelectorAll('.reveal')];
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries, instance) => entries.forEach((entry) => {if(entry.isIntersecting){entry.target.classList.add('visible');instance.unobserve(entry.target);}}),{threshold:.12,rootMargin:'0px 0px -35px 0px'});
          revealNodes.forEach((node)=>observer.observe(node));
        } else revealNodes.forEach((node)=>node.classList.add('visible'));
        document.querySelectorAll('.faq-item').forEach((item)=>item.addEventListener('toggle',()=>{if(item.open)document.querySelectorAll('.faq-item[open]').forEach((other)=>{if(other!==item)other.removeAttribute('open');});}));
      };

      fetch(base + 'landing.v1.html')
        .then((response) => { if (!response.ok) throw new Error(`Preview source returned ${response.status}`); return response.text(); })
        .then((html) => {
          const rendered = html
            .replace('/site/assets/landing.v1.css', base + 'landing.v1.css')
            .replace(/<script[^>]*landing\.v1\.js[^>]*><\/script>/, '')
            .replaceAll('href="/app"', `href="${onboarding}" data-preview-start="true"`)
            .replaceAll('href="/start"', `href="${onboarding}" data-preview-start="true"`)
            .replaceAll('href="/"', 'href="#"');
          document.open(); document.write(rendered); document.close();
          bootLanding();
        })
        .catch((error) => {
          document.body.innerHTML = `<div style="max-width:560px;padding:32px;line-height:1.6"><h1 style="font-size:24px">Preview failed to load</h1><p style="color:#9aa3ad">${error.message}</p></div>`;
        });
    })();
  </script>
</body>
</html>
