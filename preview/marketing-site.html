<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Partizan marketing preview</title>
  <meta name="color-scheme" content="dark">
  <style>
    html,body{margin:0;min-height:100%;background:#080a0d;color:#f4f6f8;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    .loading{display:flex;align-items:center;gap:10px;color:#9aa3ad;font-size:13px}
    .dot{width:9px;height:9px;border-radius:50%;background:#c8ff4d;box-shadow:0 0 24px rgba(200,255,77,.45);animation:p 1s ease-in-out infinite alternate}
    @keyframes p{to{opacity:.35;transform:scale(.72)}}
  </style>
</head>
<body>
  <div class="loading"><span class="dot"></span><span>Loading Partizan preview…</span></div>
  <script>
    (() => {
      const base = 'https://raw.githack.com/vladimirutkin2mn-lgtm/Partizan_bot/preview/marketing-site-v1/app/web/';
      fetch(base + 'landing.v1.html')
        .then((response) => {
          if (!response.ok) throw new Error(`Preview source returned ${response.status}`);
          return response.text();
        })
        .then((html) => {
          const rendered = html
            .replace('/site/assets/landing.v1.css', base + 'landing.v1.css')
            .replace('/site/assets/landing.v1.js', base + 'landing.v1.js')
            .replaceAll('href="/app"', 'href="#how" title="Product workspace is disabled in static preview"')
            .replaceAll('href="/"', 'href="#"');
          document.open();
          document.write(rendered);
          document.close();
        })
        .catch((error) => {
          document.body.innerHTML = `<div style="max-width:560px;padding:32px;line-height:1.6"><h1 style="font-size:24px">Preview failed to load</h1><p style="color:#9aa3ad">${error.message}</p></div>`;
        });
    })();
  </script>
</body>
</html>
