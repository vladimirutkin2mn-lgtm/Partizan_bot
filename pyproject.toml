[project]
name = "partizan-bot"
version = "0.8.0"
description = "Autonomous AI Growth Operator for internet-native products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "stripe>=15.4,<16.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
partizan-paid-control = "app.paid_control_worker:main"
partizan-autonomous-growth = "app.autonomous_growth_worker:main"
partizan-growth-run = "app.growth_run_cli:main"
partizan-sandbox-run = "app.growth_sandbox:main"
partizan-autopilot-dogfood = "app.autopilot_dogfood:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
